# docker-compose.yml
# Runs the LOF inference server and OPC-UA bridge as a unified stack.
# Usage:
#   docker compose up --build        (first time)
#   docker compose up -d             (background after first build)
#   docker compose logs -f           (watch logs)
#   docker compose down              (stop everything)

services:

  # ── LOF Inference API ──────────────────────────────────────────────────────
  lof-chiller:
    build:
      context: .
      dockerfile: Dockerfile
    image: lof-chiller:1.0
    container_name: lof-chiller
    ports:
      - "8000:8000"          # exposes /predict, /predict/batch, /health
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── OPC-UA Bridge ──────────────────────────────────────────────────────────
  opcua-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge        # separate lightweight image
    container_name: opcua-bridge
    depends_on:
      lof-chiller:
        condition: service_healthy         # waits for inference API to be ready
    environment:
      - INFERENCE_URL=http://lof-chiller:8000/predict
      - OPC_SERVER_URL=opc.tcp://<BMS_SERVER_IP>:4840
    restart: unless-stopped
    networks:
      - bms-net

  # ── ChromaDB (copilot RAG vector store) ────────────────────────────────────
  # Start:  docker compose up chroma -d
  # Browse: http://localhost:8001/docs
  chroma:
    image: chromadb/chroma:0.5.23
    container_name: chroma
    ports:
      - "8001:8000"
    volumes:
      - ./chroma_db:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  # ── Copilot API (Step 5) — slim runtime, OpenAI embeddings ────────────────
  # Docs:   http://localhost:8002/docs
  # Test:   python3 scripts/test_copilot_api.py --diagnose
  # Ingest: docker compose run --rm copilot-api python3 scripts/ingest_documents.py
  #         docker compose --profile ingest run --rm copilot-ingest  (local embeddings)
  # Set CHROMA_MODE, EMBEDDING_BACKEND, OPENAI_API_KEY in .env.copilot (not overridden below).
  copilot-api:
    build:
      context: .
      dockerfile: Dockerfile.copilot
    image: copilot-api:1.0
    container_name: copilot-api
    ports:
      - "8002:8002"
    env_file:
      - .env.copilot
    volumes:
      - ./chroma_db:/app/chroma_db
    environment:
      - CHROMA_PERSIST_DIR=/app/chroma_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Copilot ingest (one-shot) — fat image with sentence-transformers ───────
  copilot-ingest:
    profiles: ["ingest"]
    build:
      context: .
      dockerfile: Dockerfile.copilot-ingest
    image: copilot-ingest:1.0
    env_file:
      - .env.copilot
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./data/documents:/app/data/documents:ro
    environment:
      - CHROMA_MODE=embedded
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - EMBEDDING_BACKEND=local

networks:
  bms-net:
    driver: bridge
